name: robowars_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  simple_gradient_text: ^1.3.0
  flutter_svg: ^2.2.0
  gradient_borders: ^1.0.1
  buttons_tabbar: ^1.3.15
  google_fonts: ^8.2.1
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  audioplayers: ^6.8.1
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  cloud_functions: ^6.5.0
  go_router: ^18.0.1
  google_sign_in: 6.2.1
  connectivity_plus: ^7.3.1
  intl: ^0.20.3
  freezed_annotation: ^3.1.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.5.4
  flutter_launcher_icons: ^0.13.1
  freezed: ^4.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/robovitics logo.svg
    - assets/images/app_logo.png
    - assets/images/launcher_icon.png
    - assets/images/robowars_logo.svg
    - assets/images/rbv_15_yrs.svg
    - assets/images/analog_devices_logo.svg
    - assets/images/newgravlogo-Ctub3_Gb.svg
    - assets/images/g10.svg
    - assets/loading/
    - assets/audio/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/launcher_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/launcher_icon.png"

dependency_overrides:  
  path_provider_android: 2.2.17  
  path_provider_foundation: 2.4.1  
  jni: 0.10.1 
